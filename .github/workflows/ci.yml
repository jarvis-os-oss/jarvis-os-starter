name: ci

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install cockpit deps
        run: pip install -r dashboard/requirements.txt

      - name: Secret / PII scan (gate)
        # Two independent layers: denylist literals (owner terms loaded from an
        # untracked .scan_denylist.local) AND a structural pass over EVERY file
        # incl. the scanner itself (routable public IPs + secret-shaped tokens),
        # so a hardcoded real IP can never slip past the self-exclude again.
        run: python3 scripts/scan_secrets.py

      - name: Setup script smoke (non-interactive)
        run: python3 scripts/setup.py --non-interactive --skip-upstream --skip-rename --force

      - name: Unit + integration tests
        run: python3 -m unittest discover -s tests -v
